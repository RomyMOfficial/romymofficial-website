<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  @font-face{font-family:'Noto Serif';src:url('fonts/Noto_Serif_400.ttf') format('truetype');font-weight:400;}
  @font-face{font-family:'Noto Serif';src:url('fonts/Noto_Serif_500.ttf') format('truetype');font-weight:500;}
  @font-face{font-family:'Raleway';src:url('fonts/Raleway_400.ttf') format('truetype');font-weight:400;}
  @font-face{font-family:'Raleway';src:url('fonts/Raleway_600.ttf') format('truetype');font-weight:600;}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#0d4249;
    display:flex;align-items:center;justify-content:center;
  }
  .card{
    width:100%;height:100%;
    padding:72px 96px;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
  }
  .card::before{
    content:'';position:absolute;
    top:0;left:0;right:0;height:4px;
    background:#d3a032;
  }
  .top{display:flex;flex-direction:column;gap:0;}
  .logo{
    font-family:'Noto Serif',Georgia,serif;
    font-size:28px;font-weight:400;
    color:#f3f1ec;letter-spacing:-.01em;
    margin-bottom:48px;
  }
  .logo span{color:#d3a032;}
  .headline{
    font-family:'Noto Serif',Georgia,serif;
    font-size:54px;font-weight:400;
    color:#f3f1ec;line-height:1.1;
    letter-spacing:-.02em;max-width:680px;
  }
  .bottom{
    display:flex;align-items:flex-end;justify-content:space-between;
  }
  .tagline{
    font-family:'Raleway',Arial,sans-serif;
    font-size:14px;font-weight:600;
    text-transform:uppercase;letter-spacing:.2em;
    color:#86b1b4;
  }
  .url{
    font-family:'Raleway',Arial,sans-serif;
    font-size:14px;font-weight:400;
    color:rgba(243,241,236,.4);letter-spacing:.04em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo">Romy M<span>.</span></div>
    <div class="headline">You scaled the business. Now your infrastructure needs to catch up.</div>
  </div>
  <div class="bottom">
    <div class="tagline">Growth Operations · AI Integration</div>
    <div class="url">romymofficial.com</div>
  </div>
</div>
</body>
</html>
